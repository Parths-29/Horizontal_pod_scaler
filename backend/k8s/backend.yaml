# backend/k8s/backend.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Kubernetes Deployment + Service for the FastAPI ML backend.
# Serves /predict to the KEDA scaler and /api/* to the React dashboard.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-backend
  labels:
    app: ml-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-backend
  template:
    metadata:
      labels:
        app: ml-backend
    spec:
      containers:
        - name: ml-backend
          image: ACCOUNT_ID.dkr.ecr.us-west-2.amazonaws.com/ml-backend:initial
          ports:
            - containerPort: 8000
          env:
            - name: S3_BUCKET
              value: "predictive-hpa-cluster-ml-models"
            - name: AWS_DEFAULT_REGION
              value: "us-west-2"
            - name: DEV_MODE
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ml-backend
  labels:
    app: ml-backend
spec:
  type: ClusterIP
  selector:
    app: ml-backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
