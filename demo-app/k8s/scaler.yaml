apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-external-scaler
  labels:
    app: keda-external-scaler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-external-scaler
  template:
    metadata:
      labels:
        app: keda-external-scaler
    spec:
      containers:
      - name: scaler
        # This will be replaced by the ECR image URI via CI/CD
        image: 669294687575.dkr.ecr.us-west-2.amazonaws.com/keda-scaler:initial
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 50051
        env:
        - name: GRPC_PORT
          value: "50051"
        - name: BACKEND_URL
          value: "http://ml-backend-service.default.svc.cluster.local:8000"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: keda-external-scaler-service
spec:
  selector:
    app: keda-external-scaler
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
  type: ClusterIP
